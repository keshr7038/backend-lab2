<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1e1e1e;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    color: #d4d4d4;
    width: 860px;
    padding: 0;
  }
  .titlebar {
    background: #323233;
    padding: 8px 16px;
    font-size: 12px;
    color: #cccccc;
    border-bottom: 1px solid #444;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .titlebar .dot { width:12px;height:12px;border-radius:50%; }
  .dot-red { background:#ff5f57; }
  .dot-yellow { background:#febc2e; }
  .dot-green { background:#28c840; }
  .tab-bar {
    background: #2d2d2d;
    padding: 0 16px;
    border-bottom: 1px solid #3c3c3c;
    display: flex;
    align-items: center;
    height: 35px;
  }
  .tab {
    padding: 6px 14px;
    font-size: 12px;
    color: #cccccc;
    border-bottom: 2px solid #007acc;
    cursor: pointer;
  }
  .panel-title {
    background: #252526;
    padding: 8px 16px;
    font-size: 11px;
    color: #858585;
    border-bottom: 1px solid #3c3c3c;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .request-section {
    background: #1e1e1e;
    padding: 14px 16px;
    border-bottom: 2px solid #3c3c3c;
  }
  .request-line {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .method-badge {
    font-weight: bold;
    font-size: 13px;
    color: #4fc1ff;
    min-width: 60px;
  }
  .url { color: #9cdcfe; font-size: 13px; }
  .section-label {
    font-size: 11px;
    color: #858585;
    margin: 8px 0 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .header-row { margin: 2px 0; }
  .header-key { color: #9cdcfe; }
  .header-val { color: #ce9178; }
  .code-block {
    background: #252526;
    border: 1px solid #3c3c3c;
    border-radius: 3px;
    padding: 10px 12px;
    margin-top: 4px;
  }
  .req-body pre { color: #d4d4d4; line-height: 1.5; white-space: pre-wrap; }
  .response-section {
    background: #1e1e1e;
    padding: 14px 16px;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .status-badge {
    color: #4fc1ff;
    font-weight: bold;
    font-size: 14px;
  }
  .status-text { color: #858585; font-size: 12px; }
  .response-body {
    background: #252526;
    border: 1px solid #3c3c3c;
    border-radius: 3px;
    padding: 12px 14px;
    max-height: 280px;
    overflow: auto;
  }
  .response-body pre { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .json-key { color: #9cdcfe; }
  .json-string { color: #ce9178; }
  .json-number { color: #b5cea8; }
  .json-bool { color: #569cd6; }
  .json-null { color: #569cd6; }
  .comment-line { color: #6a9955; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="titlebar">
  <div class="dot dot-red"></div>
  <div class="dot dot-yellow"></div>
  <div class="dot dot-green"></div>
  <span style="margin-left:8px;color:#858585;">REST Client — app.http</span>
</div>
<div class="tab-bar">
  <div class="tab">app.http</div>
</div>

<div class="request-section">
  <div class="panel-title">Request</div>
  <div style="padding-top:10px">
    <div class="comment-line">### 3. GET single book by ID</div>
    <div class="request-line">
      <span class="method-badge">GET</span>
      <span class="url">http://localhost:3000/books/1/</span>
    </div>
    
    
  </div>
</div>

<div class="response-section">
  <div class="panel-title">Response</div>
  <div style="padding-top:10px">
    <div class="status-line">
      <span class="status-badge">HTTP/1.1 200 OK</span>
      <span class="status-text">• Content-Type: application/json; charset=utf-8</span>
    </div>
    <div class="response-body"><pre>{
  <span class="json-key">"id":</span> <span class="json-number">1</span>,
  <span class="json-key">"title":</span> <span class="json-string">"Clean Code"</span>,
  <span class="json-key">"author":</span> <span class="json-string">"Robert C. Martin"</span>,
  <span class="json-key">"price":</span> <span class="json-number">650</span>,
  <span class="json-key">"pages":</span> <span class="json-number">464</span>
}</pre></div>
  </div>
</div>
</body>
</html>
